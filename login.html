<!doctype html>
<!-- ------- 해인 작업 부분 ------- -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="16팀 SM TOWN · 해인, 예은, 효원" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="로그인 · 눈송이들의 취향이 만나는 곳, SM TOWN"
    />
    <title>로그인 | SM TOWN</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로 가기</a>
    <div class="page page--content">
      <header class="site-header site-header--compact site-header--center">
        <a href="index.html" class="logo">SM TOWN.</a>
      </header>

      <main id="main-content" class="page-main auth auth--login">
        <form class="auth__box" action="#" method="post">
          <div class="auth__head">
            <h1 class="auth__title">로그인</h1>
            <p class="auth__desc">친구와 함께한 순간, 다시 이어가요.</p>
          </div>

          <div class="form-field">
            <label for="email" class="form-field__label">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-field__input"
              placeholder="이메일을 입력해 주세요"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="password" class="form-field__label">비밀번호</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                class="form-field__input"
                placeholder="비밀번호를 입력해 주세요"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                aria-controls="password"
                aria-pressed="false"
              >
                보기
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn--primary">로그인</button>

          <p class="auth__switch">
            아직 회원이 아니신가요? <a href="signup.html">회원가입 ›</a>
          </p>
        </form>
      </main>

      <footer class="site-footer site-footer--compact">
        <p>© 2026 SM TOWN. 모든 권리 보유.</p>
        <p>SM TOWN 팀 | 대학 팀 프로젝트</p>
      </footer>
    </div>

    <script>
      document.querySelectorAll(".password-toggle").forEach((btn) => {
        const input = document.getElementById(btn.getAttribute("aria-controls"));
        btn.addEventListener("click", () => {
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.textContent = show ? "숨기기" : "보기";
          btn.setAttribute("aria-pressed", String(show));
        });
      });

      document.querySelector(".auth__box").addEventListener("submit", (e) => {
        e.preventDefault();
        location.href = "mypage.html";
      });
    </script>
  </body>
</html>
<!-- --------------------- -->
