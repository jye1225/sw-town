<!DOCTYPE html>

<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SM TOWN</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로 가기</a>
    <div class="page page--content">
      <header class="site-header site-header--compact">
        <a href="index.html" class="logo">SM TOWN.</a>
        <!-- ------- 예은 작업 부분: GROUP / MY PAGE 메뉴 링크 연결 ------- -->
        <nav class="gnb gnb--compact" aria-label="주요 메뉴">
          <a href="index.html" class="gnb__link is-active" aria-current="page">HOME</a>
          <a href="friend.html" class="gnb__link">FRIEND</a>
          <a href="group.html" class="gnb__link">GROUP</a>
          <a href="calendar.html" class="gnb__link">CALENDAR</a>
          <a href="mypage.html" class="gnb__link">MY PAGE</a>
          <a href="login.html" class="profile-btn" aria-label="로그인">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
            </svg>
          </a>
        </nav>
        <!-- --------------------- -->
      </header>

      <!-- ------- 해인 작업 부분: 본문 ------- -->
      <main id="main-content" class="page-main home">
        <section class="hero">
          <p class="hero__eyebrow">눈송이들의 취향이 만나는 곳</p>
          <h1 class="hero__title">취향이 맞는 친구, 함께할 소모임을 찾아요.</h1>
        </section>

        <section class="feature-list">
          <a href="friend.html" class="feature-card">
            <img src="images/main/find-friend.jpeg" alt="" class="feature-card__img" />
            <div class="feature-card__body">
              <h2 class="feature-card__title">친구 찾기</h2>
              <p class="feature-card__desc">나와 비슷한 취향의 대학생을 만나요.</p>
            </div>
          </a>
          <!-- ------- 예은 작업 부분: 소모임 목록 링크 연결 ------- -->
          <a href="group.html" class="feature-card">
            <img src="images/main/find-group.jpeg" alt="" class="feature-card__img" />
            <div class="feature-card__body">
              <h2 class="feature-card__title">소모임 찾기</h2>
              <p class="feature-card__desc">관심 있는 활동을 함께할 사람들을 만나요.</p>
            </div>
          </a>
          <!-- --------------------- -->
        </section>

        <section class="guide">
          <div class="guide__body">
            <h2 class="guide__title">SM TOWN에는 처음인가요?</h2>
            <p class="guide__desc">취향을 채우고, 친구와 소모임을 만나고, 함께한 순간을 기록해요.</p>
            <a href="signup.html" class="guide__link">회원가입하기 →</a>
          </div>
        </section>
      </main>
      <!-- --------------------- -->

      <footer class="site-footer site-footer--compact">
        <p>© 2026 SM TOWN. 모든 권리 보유.</p>
        <p>SM TOWN 팀 | 대학 팀 프로젝트</p>
