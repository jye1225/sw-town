<!DOCTYPE html>
<!-- ------- 해인 작업 부분 ------- -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | SM TOWN</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로 가기</a>
    <div class="page page--content">
      <header class="site-header site-header--compact site-header--center">
        <a href="index.html" class="logo">SM TOWN.</a>
      </header>

      <main id="main-content" class="page-main auth">
        <form class="auth__box" action="#" method="post">
          <div class="auth__head">
            <h1 class="auth__title">회원가입</h1>
            <p class="auth__desc">새로운 친구와 나만의 순간을 시작해요.</p>
          </div>

          <div class="form-field">
            <label for="email" class="form-field__label">이메일</label>
            <input type="email" id="email" name="email" class="form-field__input"
              placeholder="이메일을 입력해 주세요" autocomplete="email" required />
          </div>

          <div class="form-field">
            <label for="password" class="form-field__label">비밀번호</label>
            <div class="password-field">
              <input type="password" id="password" name="password" class="form-field__input"
                placeholder="8자 이상 입력해 주세요" minlength="8" autocomplete="new-password" required />
              <button type="button" class="password-toggle" aria-controls="password" aria-pressed="false">보기</button>
            </div>
          </div>

          <div class="form-field">
            <label for="password-confirm" class="form-field__label">비밀번호 확인</label>
            <div class="password-field">
              <input type="password" id="password-confirm" name="passwordConfirm" class="form-field__input"
                placeholder="비밀번호를 한 번 더 입력해 주세요" autocomplete="new-password" required />
              <button type="button" class="password-toggle" aria-controls="password-confirm" aria-pressed="false">보기</button>
            </div>
          </div>

          <div class="form-field">
            <label for="nickname" class="form-field__label">닉네임</label>
            <input type="text" id="nickname" name="nickname" class="form-field__input"
              placeholder="사용할 닉네임을 입력해 주세요" required />
          </div>

          <button type="submit" class="btn btn--primary">회원가입</button>

          <p class="auth__switch">
            이미 회원이신가요? <a href="login.html">로그인 ›</a>
          </p>
        </form>
      </main>

      <footer class="site-footer site-footer--compact">
        <p>© 2026 SM TOWN. 모든 권리 보유.</p>
        <p>SM TOWN 팀 | 대학 팀 프로젝트</p>
      </footer>
    </div>

    <script>
      document.querySelectorAll(".password-toggle").forEach((btn) => {
        const input = document.getElementById(btn.getAttribute("aria-controls"));
        btn.addEventListener("click", () => {
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.textContent = show ? "숨기기" : "보기";
          btn.setAttribute("aria-pressed", String(show));
        });
      });

      const password = document.getElementById("password");
      const passwordConfirm = document.getElementById("password-confirm");

      function checkPasswordMatch() {
        const mismatch = passwordConfirm.value && password.value !== passwordConfirm.value;
        passwordConfirm.setCustomValidity(mismatch ? "비밀번호가 일치하지 않아요." : "");
      }

      password.addEventListener("input", checkPasswordMatch);
      passwordConfirm.addEventListener("input", checkPasswordMatch);

      document.querySelector(".auth__box").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("가입을 환영합니다!");
        location.href = "index.html";
      });
    </script>
  </body>
</html>
