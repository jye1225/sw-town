<!doctype html>
<!-- ------- 해인 작업 부분 ------- -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="16팀 SM TOWN · 해인, 예은, 효원" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="회원가입 · 눈송이들의 취향이 만나는 곳, SM TOWN"
    />
    <title>회원가입 | SM TOWN</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로 가기</a>
    <div class="page page--content">
      <header class="site-header site-header--compact site-header--center">
        <a href="index.html" class="logo">SM TOWN.</a>
      </header>

      <main id="main-content" class="page-main auth">
        <form
          class="auth__box"
          action="signup.html#signup-complete"
          method="get"
        >
          <div class="auth__head">
            <h1 class="auth__title">회원가입</h1>
            <p class="auth__desc">새로운 친구와 나만의 순간을 시작해요.</p>
          </div>

          <div class="form-field">
            <label for="email" class="form-field__label">이메일</label>
            <input
              type="email"
              id="email"
              class="form-field__input"
              placeholder="이메일을 입력해 주세요"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="password" class="form-field__label">비밀번호</label>
            <input
              type="password"
              id="password"
              class="form-field__input"
              placeholder="8자 이상 입력해 주세요"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-field">
            <label for="password-confirm" class="form-field__label"
              >비밀번호 확인</label
            >
            <input
              type="password"
              id="password-confirm"
              class="form-field__input"
              placeholder="비밀번호를 한 번 더 입력해 주세요"
              minlength="8"
              autocomplete="new-password"
              aria-describedby="password-confirm-hint"
              required
            />
            <p class="form-field__hint" id="password-confirm-hint">
              위에 입력한 비밀번호와 똑같이 입력해 주세요.
            </p>
          </div>

          <div class="form-field">
            <label for="nickname" class="form-field__label">닉네임</label>
            <input
              type="text"
              id="nickname"
              class="form-field__input"
              placeholder="사용할 닉네임을 입력해 주세요"
              required
            />
          </div>

          <button type="submit" class="btn btn--primary">회원가입</button>

          <p class="auth__switch">
            이미 회원이신가요? <a href="login.html">로그인 ›</a>
          </p>
        </form>

        <section
          class="auth__box auth-complete"
          id="signup-complete"
          tabindex="-1"
          aria-labelledby="signup-complete-title"
        >
          <img
            class="auth-complete__img"
            src="images/profile/snow-avatar.svg"
            alt=""
            width="120"
            height="140"
          />
          <div class="auth__head">
            <h1 class="auth__title" id="signup-complete-title">
              가입을 환영해요!
            </h1>
            <p class="auth__desc">
              이제 SM TOWN에서 취향이 맞는 친구와 소모임을 만나 보세요.
            </p>
          </div>
          <a href="profile-edit.html" class="btn btn--primary"
            >내 프로필 채우러 가기</a
          >
          <a href="index.html" class="btn">홈으로 가기</a>
        </section>
      </main>

      <footer class="site-footer site-footer--compact">
        <p>© 2026 SM TOWN. 모든 권리 보유.</p>
        <p>SM TOWN 팀 | 대학 팀 프로젝트</p>
      </footer>
    </div>
  </body>
</html>
